<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMMS MVP — Visual User Stories</title>
<style>
  :root {
    --primary: #2c5282;
    --primary-light: #ebf8ff;
    --critical: #e53e3e;
    --critical-light: #fff5f5;
    --success: #38a169;
    --success-light: #f0fff4;
    --warning: #ecc94b;
    --warning-light: #fffff0;
    --purple: #805ad5;
    --purple-light: #faf5ff;
    --orange: #dd6b20;
    --orange-light: #fffaf0;
    --teal: #319795;
    --teal-light: #e6fffa;
    --gray: #718096;
    --gray-light: #f7fafc;
    --dark: #1a202c;
    --border: #e2e8f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f7fafc;
    color: var(--dark);
  }

  /* Navigation */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: white; border-bottom: 1px solid var(--border);
    padding: 12px 32px; display: flex; align-items: center; gap: 16px;
    backdrop-filter: blur(8px);
  }
  .nav-brand { font-size: 16px; font-weight: 700; color: var(--primary); }
  .nav-sep { color: var(--gray); }
  .nav-title { font-size: 15px; font-weight: 600; }
  .nav-counter { margin-left: auto; font-size: 13px; color: var(--gray); }
  .nav-btn {
    width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 6px;
    background: white; cursor: pointer; font-size: 14px; display: flex; align-items: center;
    justify-content: center; transition: all 0.15s;
  }
  .nav-btn:hover { background: var(--primary-light); border-color: var(--primary); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  /* Module overview */
  .overview {
    margin-top: 56px; padding: 32px; display: flex; gap: 16px; flex-wrap: wrap;
  }
  .overview-card {
    flex: 1; min-width: 200px; padding: 16px 20px; background: white; border-radius: 10px;
    border: 1px solid var(--border); cursor: pointer; transition: all 0.15s;
  }
  .overview-card:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(44,82,130,0.12); transform: translateY(-1px); }
  .overview-num { font-size: 24px; font-weight: 800; color: var(--primary); }
  .overview-label { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .overview-count { font-size: 11px; color: var(--gray); margin-top: 4px; }

  /* Slide container */
  .slides { padding: 80px 32px 32px; }

  /* Module header slide */
  .module-header {
    max-width: 1200px; margin: 0 auto 32px; padding: 32px 40px;
    background: white; border-radius: 16px; border: 1px solid var(--border);
    display: flex; align-items: center; gap: 24px;
  }
  .module-icon {
    width: 64px; height: 64px; border-radius: 16px; display: flex;
    align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0;
  }
  .module-info h2 { font-size: 22px; font-weight: 700; }
  .module-info p { font-size: 14px; color: var(--gray); margin-top: 4px; }
  .module-stories { font-size: 12px; color: var(--gray); margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .module-stories span {
    padding: 2px 8px; background: var(--gray-light); border-radius: 4px;
    font-weight: 600; font-size: 11px;
  }

  /* Story slide */
  .story-slide {
    max-width: 1200px; margin: 0 auto 20px; background: white;
    border-radius: 14px; border: 1px solid var(--border); overflow: hidden;
    transition: all 0.15s;
  }
  .story-slide:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

  /* Two-column body: content + thumbnail */
  .story-body {
    display: flex; gap: 0;
  }
  .story-body-content {
    flex: 1; min-width: 0;
  }
  .story-body-thumb {
    width: 320px; flex-shrink: 0; background: var(--gray-light);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .story-thumb-label {
    padding: 8px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--gray); background: white;
    border-bottom: 1px solid var(--border); text-align: center;
  }
  .story-thumb-img {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 12px; cursor: pointer; position: relative; overflow: hidden;
  }
  .story-thumb-img img {
    width: 100%; height: 100%; max-height: 420px; object-fit: contain;
    border-radius: 6px; transition: transform 0.2s;
  }
  .story-thumb-img:hover img { transform: scale(1.03); }
  .story-thumb-img::after {
    content: 'Click to open full size'; position: absolute; bottom: 8px; right: 8px;
    font-size: 9px; color: white; background: rgba(0,0,0,0.6); padding: 2px 8px;
    border-radius: 4px; opacity: 0; transition: opacity 0.15s;
  }
  .story-thumb-img:hover::after { opacity: 1; }

  .story-header {
    padding: 20px 28px; display: flex; align-items: flex-start; gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  .story-id {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px;
    white-space: nowrap; flex-shrink: 0; margin-top: 2px;
  }
  .story-content { flex: 1; }
  .story-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
  .story-narrative {
    font-size: 14px; color: #4a5568; line-height: 1.6;
    padding: 12px 16px; background: var(--gray-light); border-radius: 8px;
    border-left: 3px solid var(--primary);
  }
  .story-narrative .role { font-weight: 700; color: var(--primary); }
  .story-narrative .action { font-weight: 600; color: var(--dark); }
  .story-narrative .value { color: var(--gray); }

  .story-meta {
    padding: 12px 28px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  .role-badge {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .role-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
  .role-tech { background: #bee3f8; color: #2a4365; }
  .role-tech::before { background: #2a4365; }
  .role-disp { background: #c6f6d5; color: #276749; }
  .role-disp::before { background: #276749; }
  .role-qa { background: #fefcbf; color: #744210; }
  .role-qa::before { background: #744210; }
  .role-ops { background: #e9d8fd; color: #553c9a; }
  .role-ops::before { background: #553c9a; }
  .role-admin { background: #fed7d7; color: #9b2c2c; }
  .role-admin::before { background: #9b2c2c; }

  .story-wireframe {
    font-size: 11px; color: var(--primary); font-weight: 500;
    padding: 3px 8px; background: var(--primary-light); border-radius: 4px;
  }

  /* Acceptance criteria */
  .story-criteria {
    padding: 16px 28px 20px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px;
  }
  .criterion {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5;
  }
  .criterion-check {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; margin-top: 1px;
  }
  .criterion.checked .criterion-check { background: var(--success); color: white; }
  .criterion.checked { background: var(--success-light); }

  /* Role color coding for story IDs */
  .id-tech { background: #bee3f8; color: #2a4365; }
  .id-disp { background: #c6f6d5; color: #276749; }
  .id-qa { background: #fefcbf; color: #744210; }
  .id-ops { background: #e9d8fd; color: #553c9a; }
  .id-admin { background: #fed7d7; color: #9b2c2c; }
  .id-multi { background: var(--gray-light); color: var(--dark); }

  /* Footer */
  .footer {
    text-align: center; padding: 32px; color: var(--gray); font-size: 13px;
  }

  /* Print styles */
  @media print {
    .nav { display: none; }
    .slides { padding-top: 0; }
    .story-slide { break-inside: avoid; margin-bottom: 16px; }
    .overview { margin-top: 0; }
  }
</style>
</head>

</div>

<div class="slides" id="slides"></div>

const roleMap = {
  tech: { label: 'Technician', cls: 'role-tech', idCls: 'id-tech' },
  disp: { label: 'Dispatcher', cls: 'role-disp', idCls: 'id-disp' },
  qa: { label: 'QA Reviewer', cls: 'role-qa', idCls: 'id-qa' },
  ops: { label: 'Ops Manager', cls: 'role-ops', idCls: 'id-ops' },
  admin: { label: 'Administrator', cls: 'role-admin', idCls: 'id-admin' },
  multi: { label: 'All Roles', cls: 'role-tech', idCls: 'id-multi' }
};

// Render overview
const overviewEl = document.getElementById('overview');
modules.forEach(m => {
  const card = document.createElement('div');
  card.className = 'overview-card';
  card.innerHTML = `
    <div class="overview-num" style="color:${m.color}">${m.num}</div>
    <div class="overview-label">${m.title}</div>
    <div class="overview-count">${m.stories.length} stor${m.stories.length === 1 ? 'y' : 'ies'}</div>
  `;
  card.onclick = () => document.getElementById('mod-' + m.id).scrollIntoView({ behavior: 'smooth' });
  overviewEl.appendChild(card);
});

// Render slides
const slidesEl = document.getElementById('slides');
modules.forEach(m => {
  // Module header
  const header = document.createElement('div');
  header.className = 'module-header';
  header.id = 'mod-' + m.id;
  header.innerHTML = `
    <div class="module-icon" style="background:${m.bg}">${m.icon}</div>
    <div class="module-info">
      <h2 style="color:${m.color}">${m.num}. ${m.title}</h2>
      <p>${m.desc}</p>
      <div class="module-stories">
        ${m.stories.map(s => `<span style="background:${m.bg};color:${m.color}">${s.id}</span>`).join('')}
      </div>
    </div>
  `;
  slidesEl.appendChild(header);

  // Story cards
  m.stories.forEach(s => {
    const primaryRole = s.roles[0];
    const r = roleMap[primaryRole];
    const slide = document.createElement('div');
    slide.className = 'story-slide';

    const roleBadges = s.roles.map(role => {
      const rm = roleMap[role];
      return `<span class="role-badge ${rm.cls}">${rm.label}</span>`;
    }).join('');

    const wireframeTag = s.wireframe
      ? `<a href="wireframes/${s.wireframe}.svg" class="story-wireframe" target="_blank">${s.wireframe.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</a>`
      : '';

    const criteriaHTML = s.criteria.map(c => `
      <div class="criterion checked">
        <div class="criterion-check">✓</div>
        <div>${c}</div>
      </div>
    `).join('');

    const thumbHTML = s.wireframe
      ? `<div class="story-body-thumb">
           <div class="story-thumb-label">Wireframe — ${s.wireframe.replace(/\b\w/g, c => c.toUpperCase()).replace(/-/g, ' ')}</div>
           <a href="wireframes/${s.wireframe}.svg" target="_blank" class="story-thumb-img">
             <img src="wireframes/${s.wireframe}.svg" alt="${s.wireframe}" loading="lazy">
           </a>
         </div>`
      : '';

    slide.innerHTML = `
      <div class="story-header">
        <span class="story-id ${r.idCls}">${s.id}</span>
        <div class="story-content">
          <div class="story-title">${s.title}</div>
          <div class="story-narrative">
            <span class="role">As a</span> ${s.asA},
            <span class="action">I want to</span> ${s.action}
            <span class="value">so that</span> ${s.value}.
          </div>
        </div>
      </div>
      <div class="story-body">
        <div class="story-body-content">
          <div class="story-meta">
            ${roleBadges}
            ${wireframeTag}
          </div>
          <div class="story-criteria">
            ${criteriaHTML}
          </div>
        </div>
        ${thumbHTML}
      </div>
    `;
    slidesEl.appendChild(slide);
  });
});
