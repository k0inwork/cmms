<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="375" height="812" fill="#f7fafc"/>

  <!-- Header -->
  <rect width="375" height="56" fill="white"/>
  <line x1="0" y1="56" x2="375" y2="56" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="35" fill="#1a202c" font-size="17" font-weight="600">Sync Conflict</text>
  <text x="20" y="36" fill="#2c5282" font-size="20">←</text>

  <!-- Conflict count -->
  <rect x="16" y="68" width="343" height="44" fill="#fff5f5" rx="8" stroke="#fed7d7" stroke-width="1"/>
  <text x="32" y="86" fill="#e53e3e" font-size="12" font-weight="600">⚠ 2 conflicts found during sync</text>
  <text x="32" y="104" fill="#9b2c2c" font-size="11">Review and resolve each conflict to complete sync</text>

  <!-- Conflict 1 -->
  <rect x="16" y="124" width="343" height="340" fill="white" rx="10" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.04))"/>

  <!-- Conflict header -->
  <rect x="24" y="132" width="327" height="32" fill="#fff5f5" rx="6"/>
  <text x="40" y="153" fill="#e53e3e" font-size="12" font-weight="600">Conflict 1 of 2 — Inspection INS-2025-0087</text>

  <!-- Field label -->
  <text x="32" y="186" fill="#718096" font-size="11" font-weight="600">FIELD: trailing_edge_crack.severity</text>

  <!-- Server version -->
  <rect x="24" y="196" width="327" height="80" fill="#ebf8ff" rx="6" stroke="#2c5282" stroke-width="1"/>
  <text x="40" y="216" fill="#2c5282" font-size="11" font-weight="700">SERVER VERSION (latest)</text>
  <text x="40" y="240" fill="#1a202c" font-size="14" font-weight="500">MAJOR</text>
  <text x="40" y="260" fill="#718096" font-size="10">Updated by QA Reviewer Lena Berg · May 8, 14:55</text>
  <circle cx="330" cy="232" r="14" fill="#2c5282"/>
  <text x="330" y="236" text-anchor="middle" fill="white" font-size="11" font-weight="700">✓</text>

  <!-- Local version -->
  <rect x="24" y="284" width="327" height="80" fill="#edf2f7" rx="6" stroke="#cbd5e0" stroke-width="1"/>
  <text x="40" y="304" fill="#718096" font-size="11" font-weight="700">YOUR VERSION (offline edit)</text>
  <text x="40" y="328" fill="#1a202c" font-size="14" font-weight="500">MINOR</text>
  <text x="40" y="348" fill="#718096" font-size="10">Edited by you · May 8, 11:20 (before server update)</text>
  <circle cx="330" cy="320" r="14" fill="white" stroke="#cbd5e0" stroke-width="1"/>
  <text x="330" y="324" text-anchor="middle" fill="#a0aec0" font-size="11">○</text>

  <!-- Merge option -->
  <rect x="24" y="376" width="327" height="36" fill="#f7fafc" rx="6"/>
  <circle cx="44" cy="394" r="10" fill="white" stroke="#cbd5e0" stroke-width="1"/>
  <text x="62" y="398" fill="#718096" font-size="12">Keep both (manual merge)</text>

  <!-- Resolution buttons -->
  <rect x="24" y="424" width="155" height="36" fill="#2c5282" rx="6"/>
  <text x="101" y="446" text-anchor="middle" fill="white" font-size="12" font-weight="600">Use Server</text>
  <rect x="192" y="424" width="155" height="36" fill="white" rx="6" stroke="#cbd5e0" stroke-width="1"/>
  <text x="269" y="446" text-anchor="middle" fill="#4a5568" font-size="12" font-weight="600">Use Mine</text>

  <!-- Conflict 2 preview -->
  <rect x="16" y="480" width="343" height="60" fill="white" rx="10" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.04))"/>
  <rect x="24" y="488" width="327" height="32" fill="#fffff0" rx="6"/>
  <text x="40" y="509" fill="#744210" font-size="12" font-weight="600">Conflict 2 — Inspection INS-2025-0087</text>
  <text x="40" y="529" fill="#718096" font-size="11">field: blade_surface.notes · Tap to resolve →</text>

  <!-- Summary -->
  <rect x="16" y="556" width="343" height="48" fill="#f7fafc" rx="8"/>
  <text x="32" y="576" fill="#718096" font-size="12">Resolution progress</text>
  <rect x="32" y="586" width="311" height="6" fill="#edf2f7" rx="3"/>
  <rect x="32" y="586" width="155" height="6" fill="#38a169" rx="3"/>
  <text x="260" y="597" fill="#718096" font-size="10">0 of 2 resolved</text>

  <!-- Bottom action -->
  <rect x="16" y="620" width="343" height="50" fill="#edf2f7" rx="10"/>
  <text x="187" y="649" text-anchor="middle" fill="#718096" font-size="14" font-weight="500">Resolve all conflicts to complete sync</text>

  <!-- Home indicator -->
  <rect x="120" y="794" width="135" height="5" fill="#cbd5e0" rx="3"/>
</svg>