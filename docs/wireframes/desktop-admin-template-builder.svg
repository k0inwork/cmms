<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1440" height="900" fill="#f7fafc"/>

  <!-- Top Navigation Bar -->
  <rect width="1440" height="56" fill="white"/>
  <line x1="0" y1="56" x2="1440" y2="56" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="36" fill="#2c5282" font-size="18" font-weight="700">CMMS</text>
  <text x="90" y="36" fill="#718096" font-size="14">|</text>
  <text x="104" y="36" fill="#1a202c" font-size="15" font-weight="600">Admin — Template Builder</text>

  <text x="300" y="36" fill="#718096" font-size="14">Dashboard</text>
  <text x="420" y="36" fill="#718096" font-size="14">Assets</text>
  <text x="520" y="36" fill="#718096" font-size="14">Inspections</text>
  <text x="640" y="36" fill="#718096" font-size="14">Dispatch</text>
  <text x="740" y="36" fill="#718096" font-size="14">Tickets</text>
  <text x="830" y="36" fill="#2c5282" font-size="14" font-weight="600" text-decoration="underline">Admin</text>
  <circle cx="1380" cy="28" r="16" fill="#ebf8ff"/>
  <text x="1380" y="33" text-anchor="middle" fill="#2c5282" font-size="13" font-weight="600">TM</text>

  <!-- Sub-nav tabs -->
  <rect x="24" y="68" width="1392" height="36" fill="white" rx="4"/>
  <text x="40" y="92" fill="#718096" font-size="13">Users</text>
  <text x="100" y="92" fill="#2c5282" font-size="13" font-weight="600">Inspection Templates</text>
  <text x="280" y="92" fill="#718096" font-size="13">Workflow Rules</text>
  <text x="400" y="92" fill="#718096" font-size="13">Skills &amp; Certifications</text>
  <text x="570" y="92" fill="#718096" font-size="13">System Settings</text>

  <!-- Template List (Left Panel) -->
  <rect x="24" y="116" width="320" height="760" fill="white" rx="8" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.04))"/>
  <text x="40" y="144" fill="#1a202c" font-size="14" font-weight="700">Templates (5)</text>
  <rect x="280" y="128" width="50" height="24" fill="#2c5282" rx="4"/>
  <text x="305" y="144" text-anchor="middle" fill="white" font-size="11" font-weight="600">+ New</text>

  <!-- Search -->
  <rect x="40" y="156" width="288" height="28" fill="#edf2f7" rx="6"/>
  <text x="60" y="175" fill="#a0aec0" font-size="12">Search templates...</text>

  <!-- Template list items -->
  <rect x="32" y="196" width="304" height="52" fill="#ebf8ff" rx="6" stroke="#2c5282" stroke-width="1"/>
  <text x="48" y="218" fill="#1a202c" font-size="13" font-weight="600">Blade Inspection</text>
  <text x="48" y="236" fill="#718096" font-size="11">v3.2 · 6 fields · Active</text>
  <rect x="280" y="208" width="40" height="20" fill="#c6f6d5" rx="4"/>
  <text x="300" y="222" text-anchor="middle" fill="#276749" font-size="9" font-weight="600">LIVE</text>

  <rect x="32" y="256" width="304" height="52" fill="white" rx="6"/>
  <text x="48" y="278" fill="#1a202c" font-size="13" font-weight="500">Gearbox Inspection</text>
  <text x="48" y="296" fill="#718096" font-size="11">v2.1 · 8 fields · Active</text>

  <rect x="32" y="316" width="304" height="52" fill="white" rx="6"/>
  <text x="48" y="338" fill="#1a202c" font-size="13" font-weight="500">Electrical Inspection</text>
  <text x="48" y="356" fill="#718096" font-size="11">v1.4 · 10 fields · Active</text>

  <rect x="32" y="376" width="304" height="52" fill="white" rx="6"/>
  <text x="48" y="398" fill="#1a202c" font-size="13" font-weight="500">Foundation Check</text>
  <text x="48" y="416" fill="#718096" font-size="11">v1.0 · 4 fields · Draft</text>
  <rect x="280" y="388" width="40" height="20" fill="#fefcbf" rx="4"/>
  <text x="300" y="402" text-anchor="middle" fill="#744210" font-size="9" font-weight="600">DRAFT</text>

  <rect x="32" y="436" width="304" height="52" fill="white" rx="6"/>
  <text x="48" y="458" fill="#1a202c" font-size="13" font-weight="500">Annual Tower Inspection</text>
  <text x="48" y="476" fill="#718096" font-size="11">v2.0 · 14 fields · Active</text>

  <!-- Right Panel: Template Editor -->
  <rect x="360" y="116" width="1056" height="760" fill="white" rx="8" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.04))"/>

  <!-- Template Header -->
  <text x="380" y="148" fill="#1a202c" font-size="18" font-weight="700">Blade Inspection</text>
  <rect x="540" y="132" width="55" height="22" fill="#c6f6d5" rx="4"/>
  <text x="567" y="148" text-anchor="middle" fill="#276749" font-size="10" font-weight="600">v3.2</text>
  <text x="380" y="170" fill="#718096" font-size="13">Last updated: May 5, 2025 by Tom Miller · Applies to: Blade Assembly</text>

  <!-- Action buttons -->
  <rect x="1200" y="128" width="90" height="28" fill="white" rx="6" stroke="#cbd5e0" stroke-width="1"/>
  <text x="1245" y="147" text-anchor="middle" fill="#4a5568" font-size="12" font-weight="600">Preview</text>
  <rect x="1300" y="128" width="100" height="28" fill="#2c5282" rx="6"/>
  <text x="1350" y="147" text-anchor="middle" fill="white" font-size="12" font-weight="600">Save Draft</text>

  <!-- Settings row -->
  <rect x="380" y="184" width="1016" height="36" fill="#f7fafc" rx="4"/>
  <text x="396" y="207" fill="#718096" font-size="11">Frequency:</text>
  <text x="464" y="207" fill="#1a202c" font-size="11" font-weight="500">Quarterly</text>
  <text x="540" y="207" fill="#718096" font-size="11">|</text>
  <text x="560" y="207" fill="#718096" font-size="11">Estimated time:</text>
  <text x="648" y="207" fill="#1a202c" font-size="11" font-weight="500">45 min</text>
  <text x="700" y="207" fill="#718096" font-size="11">|</text>
  <text x="720" y="207" fill="#718096" font-size="11">Required certs:</text>
  <text x="816" y="207" fill="#1a202c" font-size="11" font-weight="500">Blade Inspection, Rope Access</text>

  <!-- Field Builder -->
  <text x="380" y="248" fill="#1a202c" font-size="14" font-weight="700">Fields (6)</text>
  <rect x="1300" y="232" width="96" height="26" fill="#ebf8ff" rx="4" stroke="#2c5282" stroke-width="1" stroke-dasharray="4"/>
  <text x="1348" y="250" text-anchor="middle" fill="#2c5282" font-size="12" font-weight="600">+ Add Field</text>

  <!-- Field 1 -->
  <rect x="380" y="264" width="1016" height="72" fill="white" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="380" y="264" width="40" height="72" fill="#edf2f7" rx="8"/>
  <text x="400" y="304" text-anchor="middle" fill="#718096" font-size="16">⇅</text>
  <text x="436" y="290" fill="#1a202c" font-size="13" font-weight="600">1. Trailing Edge Damage</text>
  <rect x="620" y="276" width="65" height="20" fill="#ebf8ff" rx="4"/>
  <text x="652" y="290" text-anchor="middle" fill="#2c5282" font-size="10" font-weight="600">PASS/FAIL</text>
  <rect x="695" y="276" width="55" height="20" fill="#fed7d7" rx="4"/>
  <text x="722" y="290" text-anchor="middle" fill="#9b2c2c" font-size="10" font-weight="600">REQUIRED</text>
  <text x="436" y="318" fill="#718096" font-size="11">Triggers auto-ticket on FAIL · Allow photo evidence · Condition rating on fail</text>
  <text x="1360" y="304" fill="#718096" font-size="14">⋮</text>

  <!-- Field 2 -->
  <rect x="380" y="344" width="1016" height="72" fill="white" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="380" y="344" width="40" height="72" fill="#edf2f7" rx="8"/>
  <text x="400" y="384" text-anchor="middle" fill="#718096" font-size="16">⇅</text>
  <text x="436" y="370" fill="#1a202c" font-size="13" font-weight="600">2. Crack Length (mm)</text>
  <rect x="620" y="356" width="55" height="20" fill="#ebf8ff" rx="4"/>
  <text x="647" y="370" text-anchor="middle" fill="#2c5282" font-size="10" font-weight="600">NUMBER</text>
  <rect x="685" y="356" width="55" height="20" fill="#fed7d7" rx="4"/>
  <text x="712" y="370" text-anchor="middle" fill="#9b2c2c" font-size="10" font-weight="600">REQUIRED</text>
  <text x="436" y="398" fill="#718096" font-size="11">Conditional: shown when Trailing Edge Damage = FAIL · Min: 0, Max: 2000</text>
  <text x="1360" y="384" fill="#718096" font-size="14">⋮</text>

  <!-- Field 3 -->
  <rect x="380" y="424" width="1016" height="72" fill="white" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="380" y="424" width="40" height="72" fill="#edf2f7" rx="8"/>
  <text x="400" y="464" text-anchor="middle" fill="#718096" font-size="16">⇅</text>
  <text x="436" y="450" fill="#1a202c" font-size="13" font-weight="600">3. Notes</text>
  <rect x="620" y="436" width="50" height="20" fill="#ebf8ff" rx="4"/>
  <text x="645" y="450" text-anchor="middle" fill="#2c5282" font-size="10" font-weight="600">TEXT</text>
  <rect x="680" y="436" width="70" height="20" fill="#c6f6d5" rx="4"/>
  <text x="715" y="450" text-anchor="middle" fill="#276749" font-size="10" font-weight="600">OPTIONAL</text>
  <text x="436" y="478" fill="#718096" font-size="11">Multi-line · Max 2000 characters · Supports markdown</text>
  <text x="1360" y="464" fill="#718096" font-size="14">⋮</text>

  <!-- Field 4 -->
  <rect x="380" y="504" width="1016" height="72" fill="white" rx="8" stroke="#2c5282" stroke-width="2"/>
  <rect x="380" y="504" width="40" height="72" fill="#ebf8ff" rx="8"/>
  <text x="400" y="544" text-anchor="middle" fill="#2c5282" font-size="16">⇅</text>
  <text x="436" y="530" fill="#2c5282" font-size="13" font-weight="700">4. Damage Photo</text>
  <rect x="620" y="516" width="55" height="20" fill="#ebf8ff" rx="4" stroke="#2c5282" stroke-width="1"/>
  <text x="647" y="530" text-anchor="middle" fill="#2c5282" font-size="10" font-weight="600">PHOTO</text>
  <rect x="685" y="516" width="55" height="20" fill="#fed7d7" rx="4"/>
  <text x="712" y="530" text-anchor="middle" fill="#9b2c2c" font-size="10" font-weight="600">REQUIRED</text>
  <text x="436" y="558" fill="#718096" font-size="11">Conditional: shown when Trailing Edge Damage = FAIL · Min 1, Max 5 photos · Geo-tagged</text>
  <text x="1360" y="544" fill="#718096" font-size="14">⋮</text>

  <!-- Field 5 -->
  <rect x="380" y="584" width="1016" height="72" fill="white" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="380" y="584" width="40" height="72" fill="#edf2f7" rx="8"/>
  <text x="400" y="624" text-anchor="middle" fill="#718096" font-size="16">⇅</text>
  <text x="436" y="610" fill="#1a202c" font-size="13" font-weight="600">5. Severity</text>
  <rect x="620" y="596" width="70" height="20" fill="#ebf8ff" rx="4"/>
  <text x="655" y="610" text-anchor="middle" fill="#2c5282" font-size="10" font-weight="600">DROPDOWN</text>
  <rect x="700" y="596" width="55" height="20" fill="#fed7d7" rx="4"/>
  <text x="727" y="610" text-anchor="middle" fill="#9b2c2c" font-size="10" font-weight="600">REQUIRED</text>
  <text x="436" y="638" fill="#718096" font-size="11">Options: Minor, Major, Critical, Catastrophic · Maps to ticket priority</text>
  <text x="1360" y="624" fill="#718096" font-size="14">⋮</text>

  <!-- Field 6 -->
  <rect x="380" y="664" width="1016" height="72" fill="white" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="380" y="664" width="40" height="72" fill="#edf2f7" rx="8"/>
  <text x="400" y="704" text-anchor="middle" fill="#718096" font-size="16">⇅</text>
  <text x="436" y="690" fill="#1a202c" font-size="13" font-weight="600">6. Inspector Signature</text>
  <rect x="620" y="676" width="60" height="20" fill="#ebf8ff" rx="4"/>
  <text x="650" y="690" text-anchor="middle" fill="#2c5282" font-size="10" font-weight="600">SIGNATURE</text>
  <rect x="690" y="676" width="55" height="20" fill="#fed7d7" rx="4"/>
  <text x="717" y="690" text-anchor="middle" fill="#9b2c2c" font-size="10" font-weight="600">REQUIRED</text>
  <text x="436" y="718" fill="#718096" font-size="11">Touch/stylus signature · Timestamped · Links to inspector profile</text>
  <text x="1360" y="704" fill="#718096" font-size="14">⋮</text>

  <!-- Version History -->
  <text x="380" y="776" fill="#1a202c" font-size="14" font-weight="700">Version History</text>
  <text x="916" y="776" fill="#718096" font-size="11">v3.2 (current) · May 5, 2025 · Tom Miller</text>
  <text x="1080" y="776" fill="#718096" font-size="11">v3.1 · Apr 1, 2025</text>
  <text x="1200" y="776" fill="#718096" font-size="11">v3.0 · Jan 15, 2025</text>
  <rect x="1280" y="762" width="100" height="24" fill="white" rx="4" stroke="#cbd5e0" stroke-width="1"/>
  <text x="1330" y="779" text-anchor="middle" fill="#4a5568" font-size="11" font-weight="600">View All</text>
</svg>
