  <rect x="76" y="450" width="56" height="56" fill="#3d3d3d" rx="6"/>
  <text x="104" y="482" text-anchor="middle" fill="#888" font-size="9">IMG_02</text>
  <rect x="140" y="450" width="56" height="56" fill="#3d3d3d" rx="6"/>
  <text x="168" y="482" text-anchor="middle" fill="#888" font-size="9">IMG_03</text>
  <rect x="204" y="450" width="56" height="56" fill="#3d3d3d" rx="6"/>
  <text x="232" y="482" text-anchor="middle" fill="#888" font-size="9">VID_01</text>
