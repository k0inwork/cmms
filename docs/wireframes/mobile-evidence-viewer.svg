  <text x="56" y="35" fill="white" font-size="17" font-weight="600">Evidence Viewer</text>
  <text x="351" y="35" text-anchor="end" fill="#2c5282" font-size="14" font-weight="600">Edit</text>

  <!-- Image Viewer Area -->
  <rect x="0" y="56" width="375" height="380" fill="#2d2d2d"/>
  <!-- Placeholder image representation -->
  <rect x="40" y="96" width="295" height="280" fill="#3d3d3d" rx="8"/>
