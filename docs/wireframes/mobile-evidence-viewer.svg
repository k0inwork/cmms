  <text x="24" y="586" fill="#888" font-size="12">Type</text>
  <text x="140" y="586" fill="white" font-size="13">Photo — JPEG</text>

  <text x="24" y="610" fill="#888" font-size="12">Captured</text>
  <text x="140" y="610" fill="white" font-size="13">May 8, 2025 · 14:32</text>

  <text x="24" y="634" fill="#888" font-size="12">GPS</text>
  <text x="140" y="634" fill="#2c5282" font-size="13">53.787°N, 1.752°E →</text>

  <text x="24" y="658" fill="#888" font-size="12">Source</text>
  <text x="140" y="658" fill="white" font-size="13">Camera (Device)</text>

  <text x="24" y="682" fill="#888" font-size="12">Inspection</text>
  <text x="140" y="682" fill="#2c5282" font-size="13">INS-2025-0087 →</text>

