<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="375" height="812" fill="#f7fafc"/>

  <!-- Header -->
  <rect width="375" height="56" fill="white"/>
  <line x1="0" y1="56" x2="375" y2="56" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="35" fill="#1a202c" font-size="17" font-weight="600">Report Absence</text>
  <text x="20" y="36" fill="#2c5282" font-size="20">←</text>

  <!-- Warning Banner -->
  <rect x="16" y="68" width="343" height="48" fill="#fed7d7" rx="10"/>
  <text x="32" y="90" fill="#9b2c2c" font-size="13" font-weight="500">⚠ You have 3 active assignments that will be affected</text>
  <text x="32" y="106" fill="#9b2c2c" font-size="12">Dispatcher will be notified for reassignment</text>

  <!-- Reason Selection -->
  <text x="24" y="148" fill="#1a202c" font-size="14" font-weight="600">Reason *</text>

  <rect x="16" y="158" width="163" height="48" fill="#fed7d7" rx="8" stroke="#e53e3e" stroke-width="2"/>
  <text x="97" y="187" text-anchor="middle" fill="#9b2c2c" font-size="14" font-weight="600">🤒 Sick</text>

  <rect x="196" y="158" width="163" height="48" fill="white" rx="8" stroke="#cbd5e0" stroke-width="1"/>
  <text x="277" y="187" text-anchor="middle" fill="#4a5568" font-size="14">🏖 Leave</text>

  <rect x="16" y="218" width="163" height="48" fill="white" rx="8" stroke="#cbd5e0" stroke-width="1"/>
  <text x="97" y="247" text-anchor="middle" fill="#4a5568" font-size="14">📚 Training</text>

  <rect x="196" y="218" width="163" height="48" fill="white" rx="8" stroke="#cbd5e0" stroke-width="1"/>
  <text x="277" y="247" text-anchor="middle" fill="#4a5568" font-size="14">Other</text>

  <!-- Start Date -->
  <text x="24" y="306" fill="#1a202c" font-size="14" font-weight="600">Start Date *</text>
  <rect x="16" y="316" width="343" height="48" fill="white" rx="8" stroke="#cbd5e0" stroke-width="1"/>
  <text x="32" y="346" fill="#1a202c" font-size="15">May 9, 2025</text>
  <text x="341" y="346" text-anchor="end" fill="#718096" font-size="14">📅</text>

  <!-- Expected Return -->
  <text x="24" y="396" fill="#1a202c" font-size="14" font-weight="600">Expected Return</text>
  <rect x="16" y="406" width="343" height="48" fill="white" rx="8" stroke="#cbd5e0" stroke-width="1"/>
  <text x="32" y="436" fill="#a0aec0" font-size="15">Select date...</text>
  <text x="341" y="436" text-anchor="end" fill="#718096" font-size="14">📅</text>

  <!-- Notes -->
  <text x="24" y="486" fill="#1a202c" font-size="14" font-weight="600">Notes</text>
  <rect x="16" y="496" width="343" height="100" fill="white" rx="8" stroke="#cbd5e0" stroke-width="1"/>
  <text x="32" y="520" fill="#a0aec0" font-size="15">Add any relevant details...</text>

  <!-- Affected Assignments -->
  <text x="24" y="630" fill="#1a202c" font-size="14" font-weight="600">Affected Assignments (3)</text>

  <rect x="16" y="644" width="343" height="44" fill="white" rx="8" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.06))"/>
  <text x="32" y="670" fill="#1a202c" font-size="13">Blade Insp. — WTG-HR-01</text>
  <text x="341" y="670" text-anchor="end" fill="#e53e3e" font-size="11" font-weight="600">HIGH</text>

  <rect x="16" y="694" width="343" height="44" fill="white" rx="8" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.06))"/>
  <text x="32" y="720" fill="#1a202c" font-size="13">Gearbox Insp. — WTG-HR-22</text>
  <text x="341" y="720" text-anchor="end" fill="#3182ce" font-size="11" font-weight="600">MED</text>

  <!-- Submit Button -->
  <rect x="16" y="750" width="343" height="48" fill="#e53e3e" rx="8"/>
  <text x="187" y="779" text-anchor="middle" fill="white" font-size="16" font-weight="600">Submit Absence Report</text>

  <rect x="120" y="794" width="135" height="5" fill="#cbd5e0" rx="3"/>
</svg>
