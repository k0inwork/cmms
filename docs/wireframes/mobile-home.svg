<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="375" height="812" fill="#f7fafc"/>

  <!-- Status Bar -->
  <rect width="375" height="44" fill="white"/>
  <text x="24" y="30" fill="#1a202c" font-size="15" font-weight="700">Hello, Alex</text>

  <!-- Sync Status Bar -->
