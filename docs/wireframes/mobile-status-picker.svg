<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="375" height="812" fill="#f7fafc"/>
  <!-- Header -->
  <rect width="375" height="56" fill="white"/>
  <line x1="0" y1="56" x2="375" y2="56" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="35" fill="#1a202c" font-size="17" font-weight="600">My Status</text>
  <text x="20" y="36" fill="#2c5282" font-size="20">←</text>

  <!-- Current Status -->
  <rect x="16" y="68" width="343" height="72" fill="#c6f6d5" rx="10"/>
  <circle cx="52" cy="104" r="20" fill="#38a169"/>
  <text x="52" y="109" text-anchor="middle" fill="white" font-size="14" font-weight="700">✓</text>
  <text x="84" y="96" fill="#1a202c" font-size="17" font-weight="700">Available</text>
  <text x="84" y="118" fill="#276749" font-size="13">Since today 08:00 · 1 active assignment</text>

  <!-- Status Options -->
  <text x="24" y="172" fill="#1a202c" font-size="15" font-weight="700">Set Status</text>

  <rect x="16" y="188" width="343" height="52" fill="#c6f6d5" rx="10" stroke="#38a169" stroke-width="2"/>
  <circle cx="48" cy="214" r="12" fill="#38a169"/>
  <text x="48" y="218" text-anchor="middle" fill="white" font-size="10" font-weight="700">✓</text>
  <text x="72" y="210" fill="#276749" font-size="15" font-weight="600">Available</text>
  <text x="72" y="228" fill="#276749" font-size="11">Ready for new assignments</text>

  <rect x="16" y="250" width="343" height="52" fill="white" rx="10" stroke="#cbd5e0" stroke-width="1"/>
  <circle cx="48" cy="276" r="12" fill="#3182ce"/>
  <text x="48" y="280" text-anchor="middle" fill="white" font-size="10" font-weight="700">→</text>
  <text x="72" y="272" fill="#1a202c" font-size="15" font-weight="500">Traveling</text>
  <text x="72" y="290" fill="#718096" font-size="11">In transit to site</text>

  <rect x="16" y="312" width="343" height="52" fill="white" rx="10" stroke="#cbd5e0" stroke-width="1"/>
  <circle cx="48" cy="338" r="12" fill="#38a169"/>
  <text x="48" y="342" text-anchor="middle" fill="white" font-size="10" font-weight="700">●</text>
  <text x="72" y="334" fill="#1a202c" font-size="15" font-weight="500">On-site</text>
  <text x="72" y="352" fill="#718096" font-size="11">At turbine location</text>

  <rect x="16" y="374" width="343" height="52" fill="white" rx="10" stroke="#cbd5e0" stroke-width="1"/>
  <circle cx="48" cy="400" r="12" fill="#ecc94b"/>
  <text x="48" y="404" text-anchor="middle" fill="white" font-size="10" font-weight="700">☕</text>
  <text x="72" y="396" fill="#1a202c" font-size="15" font-weight="500">On Break</text>
  <text x="72" y="414" fill="#718096" font-size="11">Temporarily unavailable</text>

  <rect x="16" y="436" width="343" height="52" fill="#fff5f5" rx="10" stroke="#cbd5e0" stroke-width="1"/>
  <circle cx="48" cy="462" r="12" fill="#e53e3e"/>
  <text x="48" y="466" text-anchor="middle" fill="white" font-size="10" font-weight="700">✕</text>
  <text x="72" y="458" fill="#1a202c" font-size="15" font-weight="500">Sick</text>
  <text x="72" y="476" fill="#e53e3e" font-size="11">Reports absence · Opens absence form</text>

  <rect x="16" y="498" width="343" height="52" fill="white" rx="10" stroke="#cbd5e0" stroke-width="1"/>
  <circle cx="48" cy="524" r="12" fill="#9b59b6"/>
  <text x="48" y="528" text-anchor="middle" fill="white" font-size="10" font-weight="700">📚</text>
  <text x="72" y="520" fill="#1a202c" font-size="15" font-weight="500">Training</text>
  <text x="72" y="538" fill="#718096" font-size="11">In training session</text>

  <rect x="16" y="560" width="343" height="52" fill="white" rx="10" stroke="#cbd5e0" stroke-width="1"/>
  <circle cx="48" cy="586" r="12" fill="#718096"/>
  <text x="48" y="590" text-anchor="middle" fill="white" font-size="10" font-weight="700">OFF</text>
  <text x="72" y="582" fill="#1a202c" font-size="15" font-weight="500">Unavailable</text>
  <text x="72" y="600" fill="#718096" font-size="11">Off duty or other</text>

  <!-- Note -->
  <rect x="16" y="628" width="343" height="44" fill="#fffff0" rx="8"/>
  <text x="32" y="648" fill="#744210" font-size="12" font-weight="500">💡 Changing to Sick/Leave opens the absence report form.</text>
  <text x="32" y="664" fill="#744210" font-size="12">Your dispatcher will be notified immediately.</text>

  <!-- Home indicator -->
  <rect x="120" y="794" width="135" height="5" fill="#cbd5e0" rx="3"/>
</svg>
