name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms_test?schema=public
      JWT_SECRET: test-secret
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
          POSTGRES_DB: cmms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
        env:
          RUN_INTEGRATION: "true"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t cmms-api .
      - name: Verify container starts
        run: |
          docker run -d --name cmms-test \
            -e DATABASE_URL=postgresql://x:x@x:5432/x \
            -e JWT_SECRET=test \
            -p 3000:3000 \
            cmms-api
          sleep 3
          docker logs cmms-test
          docker stop cmms-test
